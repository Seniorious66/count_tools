name: Manual planning checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify planning workbook
        run: python scripts/verify-mastersheet.py
      - name: Verify history and isolated data guards
        run: python scripts/test-workflow.py
      - name: Verify isolated commit and upload guards
        run: python scripts/test-git-trace.py
      # Flutter/signing/device/release jobs require their prerequisites first.

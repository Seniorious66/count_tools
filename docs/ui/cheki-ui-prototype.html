<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs>
<symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></symbol>
<symbol id="records" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>

<symbol id="chart" viewBox="0 0 24 24"><path d="M4 3v17h17M8 16v-5M13 16V7M18 16V4"/></symbol>

<div class="layout">
<aside class="intro"><span class="eyebrow">CHEKI & TICKETS</span><h1>轻一点，<br>记清楚。</h1><p>留白、大数字、圆角卡片。<br>浅蓝记录 Cheki，浅粉管理特典券。</p><div class="palette"><div class="swatch blue">浅蓝</div><div class="swatch pink">浅粉</div></div><p class="note">UI 提案 · 合成示例<br>可切换页面和体验分步登记。<br>合成记录可登记与修改，刷新重置。</p></aside>
<div><div class="phone" id="phone"><div class="statusbar" aria-hidden="true"><span>9:41</span><span>••• ▰</span></div><main class="scroller" id="scroller">
<section class="page" id="home-page"><header class="header"><div><h1>我的 Cheki</h1><small>2026 年 10 月</small></div><button class="icon" data-action="manage" aria-label="打开管理"><svg><use href="#settings"/></svg></button></header>
<div class="hero"><button data-go="records"><label>本月实际 Cheki</label><strong class="number"><span id="home-physical">15</span><small> 张</small></strong><small id="home-participation">成员累计 18 张</small></button><button data-go="tickets"><label>当前可用特典券</label><strong class="number"><span id="home-ticket-total">14</span><small> 张</small></strong><small id="home-ticket-pools">长期 10 · 限时 4</small></button></div>
<button class="card pending-card" data-filter-go="pending"><span><small>未领取 Cheki</small><strong class="number"><span id="pending-total">6</span> <small>张</small></strong></span><span class="muted">所有时间 · 待领取<br>查看未领取记录 ›</span></button>
<div class="actions"><button class="primary" data-action="register">＋ 记一笔</button><button class="secondary" data-action="buy">购券</button></div>
<button class="warning" id="home-expiry" data-action="expiry"><span aria-hidden="true">!</span><div><b>4 张券将于 10 月 15 日到期</b><br><small>晨星 · A 基础券　查看券池</small></div></button>
<div class="section"><h2>最近记录</h2><button class="text-link" data-go="records">全部记录</button></div><div id="recent-list"></div>
</section>
<section class="page" id="records-page" hidden><header class="header"><h1>记录</h1><button class="icon" data-action="register" aria-label="新增记录">＋</button></header><div class="summary"><strong class="number" id="record-physical">14</strong> 张 <span>／</span> <span id="record-participation">成员累计 18 张</span></div><div class="chips" id="record-filters"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="pending" aria-pressed="false">未领取</button></div><p class="muted" id="record-count">8 笔记录</p><div id="record-list"></div></section>
<section class="page" id="tickets-page" hidden><header class="header"><h1>券库</h1><button class="secondary" data-action="buy">＋ 购券</button></header><div id="ticket-content"></div></section>
<section class="page" id="stats-page" hidden><div id="stats-overview">
<header class="header"><h1>统计</h1><button class="icon" data-action="manage" aria-label="打开管理"><svg><use href="#settings"/></svg></button></header>
<div class="chips period-tabs" aria-label="统计时间范围"><button data-period="day">日</button><button data-period="week">周</button><button data-period="month" aria-pressed="true">月</button><button data-period="year">年</button><button data-period="all">所有</button></div>
<div class="period-nav"><button class="icon" data-shift="-1" aria-label="上一统计期间">‹</button><label><span class="sr-only">选择统计时间</span><input id="stats-date" type="date" value="2026-10-11"></label><button class="icon" data-shift="1" aria-label="下一统计期间">›</button></div>
<div class="stats-controls"><span class="muted" id="stats-range-label">2026-10</span><label><span class="sr-only">筛选团体</span><select id="stats-group"><option value="all">全部团体</option><option value="morning">晨星</option><option value="night">夜航</option></select></label></div>
<div class="card stats-total"><small>所选期间实际 Cheki</small><strong class="number" id="stats-physical">15 张</strong></div>
<div class="section"><h2>成员张数</h2><small>点成员看每天</small></div><div id="stats-members"></div></div><div id="stats-detail" hidden></div></section>
</main><nav class="dock" aria-label="主导航"><button data-page="home" aria-current="page"><svg><use href="#home"/></svg>首页</button><button data-page="records"><svg><use href="#records"/></svg>记录</button><button data-page="tickets"><svg><use href="#ticket"/></svg>券库</button><button data-page="stats"><svg><use href="#chart"/></svg>统计</button></nav></div><p class="demo-label">设计提案 · 合成数据 · 未保存到 App</p></div>
</div>
